<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/png" href="/favicon.png" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bitácora — The Corporate English Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --cur-navy:#1c3557;
    --cur-green:#4f7359;
    --cur-muted:#5b7288;
    --cur-muted2:#7d8b93;
    --cur-bg:#eef1ec;
    --cur-serif:"Playfair Display", Georgia, serif;
    --cur-sans:"Lato", system-ui, sans-serif;
    --shadow-sm:0 2px 10px rgba(28,53,87,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--cur-sans);background:var(--cur-bg);color:var(--cur-navy);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  #root{min-height:100vh;}

  .page{min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;}
  .container{max-width:1220px;margin:0 auto;padding:0 56px;}

  /* Sticky logo bubble */
  .sticky-logo-bubble{position:fixed;top:18px;right:34px;z-index:50;
    background:#fff;border-radius:999px;padding:12px 26px;box-shadow:0 4px 18px rgba(28,53,87,.16);
    opacity:0;transform:translateY(-8px);pointer-events:none;
    transition:opacity .18s ease,transform .18s ease;display:flex;align-items:center;}
  .sticky-logo-bubble.visible{opacity:1;transform:translateY(0);pointer-events:auto;}
  .sticky-logo-bubble img{height:68px;width:auto;display:block;}

  /* Nav */
  .nav{display:flex;align-items:center;justify-content:space-between;
    padding:0 56px 11px;max-width:1220px;margin:0 auto;width:100%;}
  .nav-logo{display:flex;align-items:center;gap:12px;}
  .nav-logo img{height:150px;width:auto;display:block;}
  .nav-right{display:flex;align-items:center;gap:10px;}
  .region-btn{display:flex;align-items:center;gap:5px;background:transparent;border:none;
    color:var(--cur-navy);font-weight:600;padding:0 4px;font-size:14px;}
  .region-gmt{font-size:12px;opacity:.85;}
  .region-divider{width:1px;height:20px;background:rgba(28,53,87,.14);margin:0 2px;flex-shrink:0;}
  .lang-toggle{display:flex;align-items:center;gap:7px;border:1px solid rgba(79,115,89,.45);
    background:#fff;border-radius:999px;padding:5px 7px 5px 13px;box-shadow:var(--shadow-sm);}
  .lang-toggle-icon{display:flex;color:var(--cur-muted);}
  .seg{border:none;background:transparent;border-radius:999px;padding:4px 11px;
    font-weight:700;font-size:13px;color:var(--cur-muted);transition:all .15s;}
  .seg.active{background:var(--cur-navy);color:#fff;}
  .nav-link{padding:9px 14px;border-radius:10px;color:var(--cur-navy);
    font-weight:600;font-size:15px;background:transparent;transition:background .15s;}
  .nav-link.active{font-weight:700;background:rgba(28,53,87,.08);}

  /* Page title */
  .blog-h1-wrap{padding:60px 56px 24px;}
  .blog-h1{font-family:var(--cur-serif);font-weight:600;font-size:62px;
    line-height:.98;letter-spacing:-.02em;text-align:center;color:var(--cur-navy);margin:0;}

  /* Filter chips */
  .chip-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
    padding:18px 0;border-top:1px solid rgba(28,53,87,.12);border-bottom:1px solid rgba(28,53,87,.12);}
  .chip{border:1px solid rgba(79,115,89,.45);border-radius:999px;padding:9px 18px;
    font-size:13px;letter-spacing:.06em;font-weight:700;color:var(--cur-navy);
    background:#fff;transition:background .15s,color .15s;white-space:nowrap;}
  .chip:hover{background:rgba(79,115,89,.08);}
  .chip.active{background:var(--cur-navy);color:#fff;border-color:var(--cur-navy);}

  /* Placeholder image */
  .ph{background-color:#e3e8e1;
    background-image:repeating-linear-gradient(135deg, rgba(79,115,89,.16) 0 10px, rgba(79,115,89,0) 10px 20px);
    position:relative;display:block;}
  .ph-cap{position:absolute;bottom:8px;left:8px;font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:10px;color:var(--cur-muted);background:rgba(255,255,255,.88);
    padding:3px 7px;border-radius:5px;letter-spacing:.02em;}

  /* Hero row */
  .hero-row{display:flex;flex-wrap:nowrap;gap:32px;padding-top:38px;padding-bottom:64px;}
  .hero-left{flex:1.5 1 300px;min-width:240px;display:flex;flex-direction:column;gap:20px;}
  .hero-left-img{height:420px;border-radius:14px;width:100%;object-fit:cover;}
  .hero-left-title{font-family:var(--cur-serif);font-weight:600;font-size:44px;
    line-height:1.06;letter-spacing:-.015em;color:var(--cur-navy);margin:0;}
  .hero-left-meta{font-size:14px;letter-spacing:.04em;color:var(--cur-muted);}
  .hero-left:hover .hero-left-title,.hero-left:hover .hero-left-meta{color:var(--cur-green);}

  .hero-right{flex:1 1 240px;min-width:220px;display:flex;flex-direction:column;}
  .hero-right-main{display:flex;flex-direction:column;gap:16px;}
  .hero-right-main-img{height:230px;border-radius:14px;width:100%;object-fit:cover;}
  .hero-right-main-title{font-family:var(--cur-serif);font-weight:600;font-size:27px;
    color:var(--cur-navy);margin:0;border-bottom:1px solid rgba(28,53,87,.35);padding-bottom:8px;
    line-height:1.2;}
  .hero-right-main-meta{font-size:14px;color:var(--cur-muted);margin-top:-8px;}
  .hero-right-main:hover .hero-right-main-title,.hero-right-main:hover .hero-right-main-meta{color:var(--cur-green);}

  .hero-right-sub-row{display:flex;align-items:flex-start;gap:20px;
    border-top:1px solid rgba(28,53,87,.14);padding-top:20px;margin-top:20px;}
  .hero-right-sub-text{flex:1;min-width:0;}
  .hero-right-sub-title{font-family:var(--cur-serif);font-weight:600;font-size:22px;
    line-height:1.18;color:var(--cur-navy);margin:0 0 6px;}
  .hero-right-sub-meta{font-size:13px;color:var(--cur-muted2);}
  .hero-right-sub-thumb{flex:0 0 110px;height:76px;border-radius:8px;object-fit:cover;}
  .hero-right-sub-row:hover .hero-right-sub-title,.hero-right-sub-row:hover .hero-right-sub-meta{color:var(--cur-green);}

  .empty-state{text-align:center;color:var(--cur-muted);font-size:16px;
    padding:64px 0;}

  @media(max-width:900px){
    .hero-row{flex-wrap:wrap;}
    .hero-left,.hero-right{flex-basis:100%;}
  }
  @media(max-width:600px){
    .nav{padding:0 20px 11px;}
    .container{padding:0 20px;}
    .blog-h1-wrap{padding:44px 20px 20px;}
    .blog-h1{font-size:clamp(34px,10vw,62px);}
    .chip-row{padding:18px 0;}
    .hero-row{padding-top:28px;padding-bottom:48px;gap:24px;}
    .sticky-logo-bubble{top:12px;right:16px;padding:9px 18px;}
    .sticky-logo-bubble img{height:52px;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState, useEffect } = React;

/* ---- Content source ----
   Plain data array — swap for MDX/CMS/JSON later without touching layout.
   Fields: title, category, readTime, image, slug
   Index 0 = hero large, 1 = hero medium, 2–3 = hero small rows. */
const POSTS = [
  {
    titleEs: "Bienvenid@s a The Corporate English Project",
    titleEn: "Welcome to The Corporate English Project",
    categoryId: "bienvenidos",
    readTime: 9,
    image: null,
    slug: "bienvenidos-a-cep",
  },
  {
    titleEs: "Cómo volverse fluido en inglés (de verdad)",
    titleEn: "How to actually become fluent in English",
    categoryId: "practica",
    readTime: 10,
    image: null,
    slug: "como-volverse-fluido-en-ingles",
  },
  {
    titleEs: "Artículos y preposiciones",
    titleEn: "Articles and prepositions",
    categoryId: "gramatica",
    readTime: 7,
    image: null,
    slug: "articulos-y-preposiciones",
  },
  {
    titleEs: "¿Cuál es mi nivel de inglés?",
    titleEn: "What's my English level?",
    categoryId: "practica",
    readTime: 6,
    image: null,
    slug: "cual-es-mi-nivel-de-ingles",
  },
];

const CATEGORIES = [
  { id: "todo",        es: "Todo",         en: "All" },
  { id: "bienvenidos", es: "Bienvenid@s",  en: "Welcome" },
  { id: "pronunciacion", es: "Pronunciación", en: "Pronunciation" },
  { id: "vocabulario", es: "Vocabulario",  en: "Vocabulary" },
  { id: "gramatica",   es: "Gramática",    en: "Grammar" },
  { id: "escucha",     es: "Escucha",      en: "Listening" },
  { id: "practica",    es: "Práctica",     en: "Practice" },
  { id: "vidadiaria",  es: "Vida diaria",  en: "Everyday Life" },
];

const STR = {
  es: {
    pageTitle: "Bitácora", blogNav: "Bitácora", home: "Inicio",
    readTime: n => `${n} min de lectura`,
    emptyFilter: "Muy pronto vas a poder filtrar por esta categoría.",
    heroCaption: "imagen principal · 1200×900",
  },
  en: {
    pageTitle: "Blog", blogNav: "Blog", home: "Home",
    readTime: n => `${n} min read`,
    emptyFilter: "You'll be able to filter by this category soon.",
    heroCaption: "main image · 1200×900",
  },
};

function catLabel(id, lang) {
  const c = CATEGORIES.find(c => c.id === id);
  return c ? c[lang] : id;
}

function postTitle(post, lang) {
  return lang === "en" ? post.titleEn : post.titleEs;
}

function metaLine(post, lang) {
  return `${catLabel(post.categoryId, lang)} · ${STR[lang].readTime(post.readTime)}`;
}

function gmtOffset(tz) {
  try {
    const s = Intl.DateTimeFormat('en', { timeZone: tz, timeZoneName: 'shortOffset' })
      .formatToParts(new Date()).find(p => p.type === 'timeZoneName')?.value || 'GMT';
    return s === 'GMT' ? 'GMT+0' : s;
  } catch (e) { return 'GMT'; }
}

function GlobeIcon() {
  return (
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="12" r="9" /><path d="M3 12h18" />
      <path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z" />
    </svg>
  );
}

function RegionBadge() {
  const [info, setInfo] = useState(null);
  useEffect(() => {
    try {
      const r = JSON.parse(localStorage.getItem('cepRegionV2'));
      const tz = (r && r.tz) || Intl.DateTimeFormat().resolvedOptions().timeZone;
      const cc = (r && r.countryCode) || 'US';
      const flag = cc === 'MX' ? '🇲🇽' : cc === 'CR' ? '🇨🇷' : cc === 'CA' ? '🇨🇦' : '🇺🇸';
      setInfo({ flag, gmt: gmtOffset(tz) });
    } catch (e) {}
  }, []);
  if (!info) return null;
  return (
    <span className="region-btn">
      <span>{info.flag}</span>
      <span className="region-gmt">{info.gmt}</span>
    </span>
  );
}

function PostImage({ post, lang, className, sizeLabel }) {
  if (post.image) {
    return <img className={className} src={post.image} alt={postTitle(post, lang)} loading="lazy" />;
  }
  return (
    <div className={className + " ph"}>
      {sizeLabel ? <span className="ph-cap">{sizeLabel}</span> : null}
    </div>
  );
}

function HeroRow({ posts, lang }) {
  if (!posts.length) return null;
  const left = posts[0];
  const right = posts.slice(1, 4);
  const rightMain = right[0];
  const rightSubs = right.slice(1);
  return (
    <div className="hero-row">
      <a className="hero-left" href={`/blog/${left.slug}.html`}>
        <PostImage post={left} lang={lang} className="hero-left-img" sizeLabel={STR[lang].heroCaption} />
        <h2 className="hero-left-title">{postTitle(left, lang)}</h2>
        <div className="hero-left-meta">{metaLine(left, lang)}</div>
      </a>
      {rightMain ? (
        <div className="hero-right">
          <a className="hero-right-main" href={`/blog/${rightMain.slug}.html`}>
            <PostImage post={rightMain} lang={lang} className="hero-right-main-img" />
            <h3 className="hero-right-main-title">{postTitle(rightMain, lang)}</h3>
            <div className="hero-right-main-meta">{metaLine(rightMain, lang)}</div>
          </a>
          {rightSubs.map((p, i) => (
            <a className="hero-right-sub-row" href={`/blog/${p.slug}.html`} key={i}>
              <div className="hero-right-sub-text">
                <h4 className="hero-right-sub-title">{postTitle(p, lang)}</h4>
                <div className="hero-right-sub-meta">{metaLine(p, lang)}</div>
              </div>
              <PostImage post={p} lang={lang} className="hero-right-sub-thumb" />
            </a>
          ))}
        </div>
      ) : null}
    </div>
  );
}

function BlogPage() {
  const [active, setActive] = useState("todo");
  const [scrolled, setScrolled] = useState(false);
  const [lang, setLang] = useState(() => {
    try { return localStorage.getItem("cepLang") || "es"; } catch (e) { return "es"; }
  });
  const s = STR[lang];

  useEffect(() => {
    try { localStorage.setItem("cepLang", lang); } catch (e) {}
    document.documentElement.lang = lang;
    document.title = `${s.pageTitle} — The Corporate English Project`;
  }, [lang]);

  useEffect(() => {
    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        setScrolled(window.scrollY > 90);
        ticking = false;
      });
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  const isAll = active === "todo";

  return (
    <div className="page">
      <div className={"sticky-logo-bubble" + (scrolled ? " visible" : "")} aria-hidden={!scrolled}>
        <a href="/" aria-label={s.home}>
          <img src="/logo-navy.png" alt="The Corporate English Project" />
        </a>
      </div>

      <nav className="nav">
        <a className="nav-logo" href="/">
          <img src="/logo-navy.png" alt="The Corporate English Project" />
        </a>
        <div className="nav-right">
          <RegionBadge />
          <div className="region-divider" />
          <div className="lang-toggle" role="group" aria-label="Language">
            <span className="lang-toggle-icon"><GlobeIcon /></span>
            <button className={"seg" + (lang === "en" ? " active" : "")} onClick={() => setLang("en")}>EN</button>
            <button className={"seg" + (lang === "es" ? " active" : "")} onClick={() => setLang("es")}>ES</button>
          </div>
          <a className="nav-link active" href="/blog">{s.blogNav}</a>
        </div>
      </nav>

      <main>
        <div className="blog-h1-wrap">
          <h1 className="blog-h1">{s.pageTitle}</h1>
        </div>

        <div className="container">
          <div className="chip-row">
            {CATEGORIES.map(cat => (
              <button key={cat.id} className={"chip" + (cat.id === active ? " active" : "")}
                onClick={() => setActive(cat.id)}>{cat[lang]}</button>
            ))}
          </div>

          {isAll ? (
            <HeroRow posts={POSTS} lang={lang} />
          ) : (
            <p className="empty-state">{s.emptyFilter}</p>
          )}
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<BlogPage />);
</script>
</body>
</html>
