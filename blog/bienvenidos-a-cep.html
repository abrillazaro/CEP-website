<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/png" href="/favicon.png" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bienvenid@s a The Corporate English Project — The Corporate English Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --cur-navy:#1c3557;
    --cur-green:#4f7359;
    --cur-muted:#5b7288;
    --cur-muted2:#7d8b93;
    --cur-bg:#eef1ec;
    --cur-serif:"Playfair Display", Georgia, serif;
    --cur-sans:"Lato", system-ui, sans-serif;
    --shadow-sm:0 2px 10px rgba(28,53,87,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--cur-sans);background:var(--cur-bg);color:var(--cur-navy);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  #root{min-height:100vh;}

  .page{min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;}

  /* Sticky logo bubble */
  .sticky-logo-bubble{position:fixed;top:18px;left:34px;z-index:50;
    background:#fff;border-radius:999px;padding:12px 26px;box-shadow:0 4px 18px rgba(28,53,87,.16);
    opacity:0;transform:translateY(-8px);pointer-events:none;
    transition:opacity .18s ease,transform .18s ease;display:flex;align-items:center;}
  .sticky-logo-bubble.visible{opacity:1;transform:translateY(0);pointer-events:auto;}
  .sticky-logo-bubble img{height:61px;width:auto;display:block;}

  /* Nav */
  .nav{display:flex;align-items:center;justify-content:space-between;
    padding:0 56px 11px;max-width:1220px;margin:0 auto;width:100%;}
  .nav-logo{display:flex;align-items:center;gap:12px;}
  .nav-logo img{height:150px;width:auto;display:block;}
  .nav-right{display:flex;align-items:center;gap:10px;}
  .region-btn{display:flex;align-items:center;gap:5px;background:transparent;border:none;
    color:var(--cur-navy);font-weight:600;padding:0 4px;font-size:14px;}
  .region-gmt{font-size:12px;opacity:.85;}
  .region-divider{width:1px;height:20px;background:rgba(28,53,87,.14);margin:0 2px;flex-shrink:0;}
  .lang-toggle{display:flex;align-items:center;gap:7px;border:1px solid rgba(79,115,89,.45);
    background:#fff;border-radius:999px;padding:5px 7px 5px 13px;box-shadow:var(--shadow-sm);}
  .lang-toggle-icon{display:flex;color:var(--cur-muted);}
  .seg{border:none;background:transparent;border-radius:999px;padding:4px 11px;
    font-weight:700;font-size:13px;color:var(--cur-muted);transition:all .15s;}
  .seg.active{background:var(--cur-navy);color:#fff;}
  .nav-link{padding:9px 14px;border-radius:10px;color:var(--cur-navy);
    font-weight:600;font-size:15px;background:transparent;transition:background .15s;}
  .nav-link.active{font-weight:700;background:rgba(28,53,87,.08);}

  /* Post content */
  .post-main{flex:1;padding:0 56px 100px;max-width:820px;margin:0 auto;width:100%;}
  .post-breadcrumb{font-size:13px;color:var(--cur-muted2);margin:0 0 22px;}
  .post-breadcrumb a:hover{color:var(--cur-navy);}
  .post-title{font-family:var(--cur-serif);font-weight:600;font-size:clamp(32px,5vw,52px);
    line-height:1.1;color:var(--cur-navy);margin:0 0 20px;}
  .post-lede{font-family:var(--cur-sans);font-weight:700;font-size:19px;
    line-height:1.6;color:var(--cur-navy);margin:0 0 28px;}
  .post-body p{font-size:17px;line-height:1.75;color:var(--cur-muted);margin:0 0 22px;}
  .post-body p:last-child{margin-bottom:32px;}
  .post-draft-note{font-size:13px;font-style:italic;color:var(--cur-muted2);margin:0 0 28px;}
  .post-toc-label{font-weight:700;font-size:17px;color:var(--cur-navy);margin:36px 0 14px;}
  .post-toc{list-style:none;margin:0 0 36px;padding:0;display:flex;flex-direction:column;gap:9px;}
  .post-toc a{font-size:16px;color:var(--cur-navy);text-decoration:underline;
    text-decoration-color:rgba(28,53,87,.35);text-underline-offset:2px;}
  .post-toc a:hover{color:var(--cur-green);}
  .post-h2{font-family:var(--cur-serif);font-weight:600;font-size:26px;color:var(--cur-navy);
    margin:8px 0 16px;scroll-margin-top:24px;}
  .post-stub{font-size:15px;font-style:italic;color:var(--cur-muted2);margin:0 0 32px;}
  .post-back{display:inline-block;font-size:14px;font-weight:700;color:var(--cur-navy);}
  .post-back:hover{color:var(--cur-green);}

  @media(max-width:600px){
    .nav{padding:0 20px 11px;}
    .post-main{padding:0 20px 64px;}
    .sticky-logo-bubble{top:12px;left:16px;padding:9px 18px;}
    .sticky-logo-bubble img{height:47px;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState, useEffect } = React;

const STR = {
  es: {
    home: "Inicio",
    title: "Bienvenid@s a The Corporate English Project",
    draftNote: "— o CEP, para abreviar.",
    back: "← Volver al inicio",
  },
  en: {
    home: "Home",
    title: "Welcome to The Corporate English Project",
    draftNote: "— or CEP, for short.",
    back: "← Back to home",
  },
};

/* Article body — bilingual, rich JSX (needs inline italics/quotes the plain
   STR strings above can't hold). Sections not written yet render as a
   heading + "coming soon" stub so the table of contents links resolve. */
const ARTICLE = {
  es: (
    <>
      <p className="post-lede">Quizás te estés preguntando: “¿Qué es The Corporate English Project? ¿Qué hace? ¿A quién sirve?”</p>
      <div className="post-body">
        <p>¡Llegaremos a todo eso en un momento! Pero antes de continuar, quiero agradecerte por profundizar lo suficiente como para leer esto. Así que, desde el fondo de mi ser: ¡GRACIAS!</p>
      </div>

      <div className="post-toc-label">En esta publicación, hablaré sobre:</div>
      <ul className="post-toc">
        <li><a href="#mision">Misión</a></li>
        <li><a href="#que-significa">¿Qué significa “The Corporate English Project”?</a></li>
        <li><a href="#a-quien-sirve">¿A quién sirve CEP?</a></li>
        <li><a href="#metodo">El método detrás de la locura (cómo y por qué)</a></li>
      </ul>

      <h2 className="post-h2" id="mision">Misión</h2>
      <div className="post-body">
        <p>En esencia, The Corporate English Project es una iniciativa global en línea que ayuda a cualquier persona que quiera hablar inglés a lograrlo. La creencia es simple: el inglés nunca debería ser la razón por la que alguien se quede fuera. CEP hace que aprender inglés sea accesible y, al hacerlo, ayuda a construir un mundo más conectado.</p>
      </div>

      <h2 className="post-h2" id="que-significa">¿Qué significa “The Corporate English Project”?</h2>
      <div className="post-body">
        <p>Nuestro proyecto obtiene parte de su nombre — <em>corporate</em> — de la raíz latina <em>corpus</em>, o cuerpo. <em>Cuerpo</em>, tal como se usa aquí, significa un grupo organizado de personas que trabajan juntas. Más específicamente, CEP es un <em>cuerpo global</em> — una organización o institución internacional que opera en varios países para promover la cooperación a nivel mundial.</p>
        <p>Mientras que un <em>proyecto</em> es una pieza de trabajo planeado y temporal, o un esfuerzo creado para lograr un objetivo específico, producir un resultado único o resolver un problema.</p>
        <p>Así que el nombre <em>The Corporate English Project</em> puede interpretarse como “el esfuerzo internacional grupal de inglés.”</p>
      </div>

      <h2 className="post-h2" id="a-quien-sirve">¿A quién sirve CEP?</h2>
      <div className="post-body">
        <p>Primero, aunque todos son bienvenidos (incluyendo profesionales que buscan mejorar su inglés de forma real y tangible) The Corporate English Project NO es un programa exclusivo para “profesionales corporativos” ni para “enseñar inglés de negocios.” Todo lo contrario — The Corporate English Project busca servir a toda la comunidad dispersa de hispanohablantes que aprenden inglés, de todos los niveles y de todos los orígenes. Lo único que los estudiantes de CEP deben tener en común es la disposición a mejorar su inglés y ser parte de una comunidad.</p>
        <p>CEP sirve a todos los estudiantes, de todas las edades, de todos los orígenes, que tienen diferentes motivaciones para aprender inglés, pero que ponen su mejor esfuerzo de todas formas.</p>
      </div>

      <h2 className="post-h2" id="metodo">El método detrás de la locura (cómo y por qué)</h2>
      <div className="post-body">
        <p>Hay quienes me dicen que tengo poco sentido para los negocios por cobrar $3 por clase, pero no me molesta — hay un método detrás de la locura.</p>
        <p>El idioma es inherentemente comunitario. Por eso, la oportunidad de tener contacto real para comunicarte con otros — a través de temas, niveles y contextos — es una herramienta vital para llegar a dominar esta ambiciosa nueva habilidad. CEP se basa en la creencia de que el mejor aprendizaje ocurre cuando los estudiantes están inmersos juntos en la experiencia completa del idioma, con todas las herramientas necesarias.</p>
        <p>Por eso nos reunimos en vivo a través de Microsoft Teams. Al ser 100% en línea, aprendemos juntos sin importar dónde te encuentres — y este formato es justo lo que nos permite mantener las clases a $3 USD por sesión sin dejar de ofrecer una experiencia de aprendizaje de alta calidad.</p>
        <p>El tamaño de nuestros grupos es intencional, hasta 15 estudiantes por sesión, para que cada estudiante tenga la participación y el involucramiento que necesita. Y como CEP se basa en comunidad, ¡trae a un amigo! Mientras más seamos, más rica será la experiencia.</p>
      </div>
    </>
  ),
  en: (
    <>
      <p className="post-lede">Perhaps you are wondering, “What is The Corporate English Project? What does it do? Who does it serve?”</p>
      <div className="post-body">
        <p>We will get to all of that in just a moment! But before proceeding, I'd like to thank you for diving deep enough to read this. So, from the bottom of my being: THANK YOU!</p>
      </div>

      <div className="post-toc-label">In this post, I will address:</div>
      <ul className="post-toc">
        <li><a href="#mission">Mission</a></li>
        <li><a href="#what-it-means">What does “The Corporate English Project” mean?</a></li>
        <li><a href="#who-it-serves">Who does CEP serve?</a></li>
        <li><a href="#method">The Method to the Madness (how and why)</a></li>
      </ul>

      <h2 className="post-h2" id="mission">Mission</h2>
      <div className="post-body">
        <p>At its core, The Corporate English Project is a global online initiative that helps anyone who wants to speak English, speak English. The belief is simple, English should never be the reason someone is left out. CEP makes English learning accessible and in doing so, helps build a more connected world.</p>
      </div>

      <h2 className="post-h2" id="what-it-means">What does “The Corporate English Project” mean?</h2>
      <div className="post-body">
        <p>Our project gets part of its name — <em>corporate</em> — from the Latin root, <em>corpus</em>, or body. <em>Body</em>, as used here, means an organized group of individuals working together. More specifically, CEP is a <em>global body</em> — an international organization or institution that operates across multiple countries to promote cooperation worldwide.</p>
        <p>While a <em>project</em> is a temporary piece of planned work, or an endeavor created to achieve a specific goal, produce a unique outcome, or solve a problem.</p>
        <p>So the name <em>The Corporate English Project</em> can be interpreted as “the international English group endeavor.”</p>
      </div>

      <h2 className="post-h2" id="who-it-serves">Who does CEP serve?</h2>
      <div className="post-body">
        <p>First, although everyone is welcome (including business professionals aiming to improve their English in a real, tangible way) The Corporate English Project is NOT a program exclusive to “corporate professionals” or to “teaching enterprise/business English.” Instead — The Corporate English Project aims to serve the entire dispersed community of Spanish-speaking English learners, from every level and every background. The only thing CEP students must have in common is that they are willing to improve their English and be part of a community.</p>
        <p>CEP serves all learners, all ages, all backgrounds, who all have different motivations to learn English but put their best foot forward nonetheless.</p>
      </div>

      <h2 className="post-h2" id="method">The Method to the Madness (how and why)</h2>
      <div className="post-body">
        <p>People tell me I have a poor sense of business for charging $3 a class, but it doesn't bother me — there's a method to the madness.</p>
        <p>Language is inherently communal. Therefore, the opportunity for facetime to communicate with others — across topics, levels, and contexts — is a vital tool for embodying this ambitious new skill. The CEP is built on the belief that the best learning happens when students are immersed together in the full experience of the language, with all the necessary tools.</p>
        <p>That's why we meet live via Microsoft Teams. Being 100% online, we learn together no matter where you are — and this format is exactly what lets us keep classes at $3 USD per session while still offering a high-quality learning experience.</p>
        <p>Our group size is intentional, up to 15 students per session, so every student gets the participation and engagement they need. And since CEP is built on community, bring a friend! The more of us there are, the richer the experience.</p>
      </div>
    </>
  ),
};

function gmtOffset(tz) {
  try {
    const s = Intl.DateTimeFormat('en', { timeZone: tz, timeZoneName: 'shortOffset' })
      .formatToParts(new Date()).find(p => p.type === 'timeZoneName')?.value || 'GMT';
    return s === 'GMT' ? 'GMT+0' : s;
  } catch (e) { return 'GMT'; }
}

function GlobeIcon() {
  return (
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="12" r="9" /><path d="M3 12h18" />
      <path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z" />
    </svg>
  );
}

function RegionBadge() {
  const [info, setInfo] = useState(null);
  useEffect(() => {
    try {
      const r = JSON.parse(localStorage.getItem('cepRegionV2'));
      const tz = (r && r.tz) || Intl.DateTimeFormat().resolvedOptions().timeZone;
      const cc = (r && r.countryCode) || 'US';
      const flag = cc === 'MX' ? '🇲🇽' : cc === 'CR' ? '🇨🇷' : cc === 'CA' ? '🇨🇦' : '🇺🇸';
      setInfo({ flag, gmt: gmtOffset(tz) });
    } catch (e) {}
  }, []);
  if (!info) return null;
  return (
    <span className="region-btn">
      <span>{info.flag}</span>
      <span className="region-gmt">{info.gmt}</span>
    </span>
  );
}

function PostPage() {
  const [scrolled, setScrolled] = useState(false);
  const [lang, setLang] = useState(() => {
    try { return localStorage.getItem("cepLang") || "es"; } catch (e) { return "es"; }
  });
  const s = STR[lang];

  useEffect(() => {
    try { localStorage.setItem("cepLang", lang); } catch (e) {}
    document.documentElement.lang = lang;
    document.title = `${s.title} — The Corporate English Project`;
  }, [lang]);

  useEffect(() => {
    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        setScrolled(window.scrollY > 90);
        ticking = false;
      });
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  return (
    <div className="page">
      <div className={"sticky-logo-bubble" + (scrolled ? " visible" : "")} aria-hidden={!scrolled}>
        <a href="/" aria-label={s.home}>
          <img src="/logo-navy.png" alt="The Corporate English Project" />
        </a>
      </div>

      <nav className="nav">
        <a className="nav-logo" href="/">
          <img src="/logo-navy.png" alt="The Corporate English Project" />
        </a>
        <div className="nav-right">
          <RegionBadge />
          <div className="region-divider" />
          <div className="lang-toggle" role="group" aria-label="Language">
            <span className="lang-toggle-icon"><GlobeIcon /></span>
            <button className={"seg" + (lang === "en" ? " active" : "")} onClick={() => setLang("en")}>EN</button>
            <button className={"seg" + (lang === "es" ? " active" : "")} onClick={() => setLang("es")}>ES</button>
          </div>
        </div>
      </nav>

      <main className="post-main">
        <div className="post-breadcrumb">
          <a href="/">{s.home}</a> {" / "}
          <span>{s.title}</span>
        </div>
        <h1 className="post-title">{s.title}</h1>
        <p className="post-draft-note">{s.draftNote}</p>
        {ARTICLE[lang]}
        <a className="post-back" href="/">{s.back}</a>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PostPage />);
</script>
</body>
</html>
