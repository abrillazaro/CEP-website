<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="/favicon.png" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Welcome to The Corporate English Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --cur-navy:#1c3557;
    --cur-green:#4f7359;
    --cur-muted:#5b7288;
    --cur-muted2:#7d8b93;
    --cur-bg:#eef1ec;
    --cur-serif:"Playfair Display", Georgia, serif;
    --cur-sans:"Lato", system-ui, sans-serif;
    --shadow-sm:0 2px 10px rgba(28,53,87,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--cur-sans);background:var(--cur-bg);color:var(--cur-navy);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  #root{min-height:100vh;}

  .page{min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;}

  /* Sticky logo bubble */
  .sticky-logo-bubble{position:fixed;top:18px;left:34px;z-index:50;
    background:#fff;border-radius:999px;padding:12px 26px;box-shadow:0 4px 18px rgba(28,53,87,.16);
    opacity:0;transform:translateY(-8px);pointer-events:none;
    transition:opacity .18s ease,transform .18s ease;display:flex;align-items:center;}
  .sticky-logo-bubble.visible{opacity:1;transform:translateY(0);pointer-events:auto;}
  .sticky-logo-bubble img{height:61px;width:auto;display:block;}

  /* Nav */
  .nav{display:flex;align-items:center;justify-content:space-between;
    padding:0 56px 11px;max-width:1220px;margin:0 auto;width:100%;}
  .nav-logo{display:flex;align-items:center;gap:12px;}
  .nav-logo img{height:150px;width:auto;display:block;}
  .nav-right{display:flex;align-items:center;gap:10px;}
  .region-btn{display:flex;align-items:center;gap:5px;background:transparent;border:none;
    color:var(--cur-navy);font-weight:600;padding:0 4px;font-size:14px;}
  .region-gmt{font-size:12px;opacity:.85;}
  .region-divider{width:1px;height:20px;background:rgba(28,53,87,.14);margin:0 2px;flex-shrink:0;}
  .lang-toggle{display:flex;align-items:center;gap:7px;border:1px solid rgba(79,115,89,.45);
    background:#fff;border-radius:999px;padding:5px 7px 5px 13px;box-shadow:var(--shadow-sm);}
  .lang-toggle-icon{display:flex;color:var(--cur-muted);}
  .seg{border:none;background:transparent;border-radius:999px;padding:4px 11px;
    font-weight:700;font-size:13px;color:var(--cur-muted);transition:all .15s;}
  .seg.active{background:var(--cur-navy);color:#fff;}

  /* Welcome content */
  .post-main{flex:1;padding:0 56px 100px;max-width:820px;margin:0 auto;width:100%;}
  .post-title{font-family:var(--cur-serif);font-weight:600;font-size:clamp(30px,4.6vw,46px);
    line-height:1.2;color:var(--cur-navy);margin:8px 0 40px;}
  .post-h2{font-family:var(--cur-serif);font-weight:600;font-size:26px;color:var(--cur-navy);
    margin:8px 0 16px;}
  .post-body p{font-size:17px;line-height:1.75;color:var(--cur-muted);margin:0 0 22px;}
  .post-body p:last-child{margin-bottom:0;}
  .post-link{color:var(--cur-navy);font-weight:700;text-decoration:underline;
    text-decoration-color:rgba(28,53,87,.35);text-underline-offset:2px;}
  .post-link:hover{color:var(--cur-green);}
  .post-list{margin:0 0 22px;padding-left:22px;display:flex;flex-direction:column;gap:10px;}
  .post-list li{font-size:17px;line-height:1.6;color:var(--cur-muted);}
  .post-section{margin:0 0 48px;}
  .post-back{display:inline-block;font-size:14px;font-weight:700;color:var(--cur-navy);margin-top:8px;}
  .post-back:hover{color:var(--cur-green);}

  @media(max-width:600px){
    .nav{padding:0 20px 11px;}
    .post-main{padding:0 20px 64px;}
    .sticky-logo-bubble{top:12px;left:16px;padding:9px 18px;}
    .sticky-logo-bubble img{height:47px;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState, useEffect } = React;

const STR = {
  es: {
    home: "Inicio",
    docTitle: "Bienvenid@ a The Corporate English Project",
    heading: "¡Felicidades! Ya eres oficialmente parte de The Corporate English Project.",
    getInTouchTitle: "Ponte en contacto:",
    getInTouchPre: "Siéntete libre de escribirme a",
    whatsappLabel: "mi WhatsApp",
    getInTouchPost: "— me encantaría saber de ti antes de que empiecen las clases. Hazme preguntas, o simplemente preséntate y cuéntame un poco sobre ti.",
    notesTitle: "Una nota sobre tomar apuntes:",
    notesP1Pre: "Por favor, ven a clase preparado(a) para tomar apuntes.",
    notesLinkLabel: "Los apuntes a mano son mejores que escribir a máquina para el aprendizaje profundo",
    notesP1Post: ", aunque escribir a máquina también funciona — mi prioridad es simplemente que tengas apuntes a los que puedas volver. Tomar apuntes te ayuda a procesar lo que sucede en clase en el momento, y si surge una duda, puedes anotarla para no perderla antes de tener la oportunidad de preguntar.",
    notesQuestion: "¿Sobre qué deberías tomar apuntes?",
    bullets: [
      "Cualquier pregunta, duda o punto de confusión",
      "El material cubierto en clase",
      "Las correcciones que hago",
      "Cualquier cosa que diga que no sea parte del material “oficial”, pero que resalte por cómo se dice",
    ],
    notesP2: "Notar cómo se dice algo y qué se está diciendo son rutinas que practico todos los días cuando hablo con angloparlantes. Nunca se deja de aprender un idioma, y aunque soy fluida y una maestra de inglés calificada, sigo prestando mucha atención a cómo habla la gente, porque me mantiene alerta y me da nuevas formas de enseñarte. He descubierto que es una de las mejores herramientas para aprender: te ayuda a entender cómo habla realmente la gente, y te da ideas reales de cómo tú también puedes hablar.",
    toolsTitle: "Usa tus herramientas:",
    toolsP1: "Estamos en la era de la información — no hay nada de malo en usar todas las herramientas que tengas disponibles, ya que están para facilitar tu aprendizaje, no para reemplazarlo. Si no sabes cómo decir algo en inglés, no tengas miedo de abrir una aplicación de traducción y averiguarlo. Usar herramientas para facilitar tu aprendizaje es algo que se fomenta.",
    toolsP2: "Este no es un programa escolar. No hay promedio, no hay calificación, no hay riesgo de “meterte en problemas”. Te recomiendo usar herramientas de traducción, sumergirte en el inglés todo lo que puedas, buscar distintas formas de decir lo mismo, y hacer un poco de tu propia investigación por tu cuenta. Usa todas las herramientas que tengas disponibles — el objetivo es que realmente aprendas inglés.",
    toolsP3: "Una advertencia: no dejes que las herramientas aprendan por ti — no pueden. Si pasas tu tarea por una inteligencia artificial generativa y entregas lo que sea que te dé sin revisarlo, sin analizarlo, y sin identificar qué entiendes y qué no, así es como las herramientas dejan de ayudarte. Todo esto se trata de tu propio crecimiento, y saltarte el paso real de “aprender” significa que tú eres quien sale perdiendo.",
    toolsP4: "Así que: usa las herramientas... ¡Usa las herramientas! ¡¡¡Usa las herramientas!!! Solo asegúrate de estar aprendiendo mientras lo haces.",
  },
  en: {
    home: "Home",
    docTitle: "Welcome to The Corporate English Project",
    heading: "Congratulations! You're officially a member of The Corporate English Project!",
    getInTouchTitle: "Get in touch:",
    getInTouchPre: "Feel free to reach out to me on",
    whatsappLabel: "my WhatsApp",
    getInTouchPost: "— I'd love to hear from you before class starts. Ask me questions, or just introduce yourself and tell me a bit about you.",
    notesTitle: "A note on note-taking:",
    notesP1Pre: "Please come to class prepared to take notes.",
    notesLinkLabel: "Handwritten notes are better than typing for deep learning",
    notesP1Post: ", though typing works too — my priority is simply that you have notes you can look back on. Taking notes helps you process what's happening in class as it happens, and if a question comes up, you can jot it down so you don't lose it before you get the chance to ask.",
    notesQuestion: "What should you take notes on?",
    bullets: [
      "Any questions, doubts, or points of confusion",
      "The material covered in class",
      "Corrections I make",
      "Anything I say that isn't part of the \"official\" material, but stands out in how it's said",
    ],
    notesP2: "Noticing how something is said and what is being said are routines I practice every day when I speak with English speakers. You never stop learning a language, and even though I'm fluent and a qualified English teacher, I still pay close attention to the way people speak, because it keeps me sharp and gives me new ways to teach you. I've found it's one of the best tools for learning: it helps you understand how people actually speak, and gives you real ideas for how you can speak too.",
    toolsTitle: "Use your tools:",
    toolsP1: "We're in the information age — there's nothing wrong with using every tool available to you, as they're facilitating your learning, not replacing it. If you don't know how to say something in English, don't be afraid to open a translation app and find out. Using tools to facilitate your learning is encouraged.",
    toolsP2: "This isn't a school program. There's no GPA, no grade, no risk of \"getting in trouble.\" I recommend using translation tools, immersing yourself in English as much as you can, searching different ways to say the same thing, and doing a bit of your own research on the side. Use every tool available to you — the goal is for you to actually learn English.",
    toolsP3: "One warning: do not let tools do your learning for you — they can't. If you run your homework through a generative AI and submit whatever it gives you without looking at it, reviewing it, and figuring out what you do and don't understand, that's how tools stop helping you. The whole point of this is your own growth, and skipping the actual \"learning\" step means you're the one who misses out.",
    toolsP4: "So: use the tools... Use the tools! Use the tools!!! Just make sure you're learning while you do.",
  },
};

const WHATSAPP_LINK = "https://wa.me/525572132329?text=" +
  encodeURIComponent("Hi, I enrolled in The Corporate English Project!");
const NOTES_ARTICLE_LINK = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11943480/";

function gmtOffset(tz) {
  try {
    const s = Intl.DateTimeFormat('en', { timeZone: tz, timeZoneName: 'shortOffset' })
      .formatToParts(new Date()).find(p => p.type === 'timeZoneName')?.value || 'GMT';
    return s === 'GMT' ? 'GMT+0' : s;
  } catch (e) { return 'GMT'; }
}

function GlobeIcon() {
  return (
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="12" r="9" /><path d="M3 12h18" />
      <path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z" />
    </svg>
  );
}

function RegionBadge() {
  const [info, setInfo] = useState(null);
  useEffect(() => {
    try {
      const r = JSON.parse(localStorage.getItem('cepRegionV2'));
      const tz = (r && r.tz) || Intl.DateTimeFormat().resolvedOptions().timeZone;
      const cc = (r && r.countryCode) || 'US';
      const flag = cc === 'MX' ? '🇲🇽' : cc === 'CR' ? '🇨🇷' : cc === 'CA' ? '🇨🇦' : '🇺🇸';
      setInfo({ flag, gmt: gmtOffset(tz) });
    } catch (e) {}
  }, []);
  if (!info) return null;
  return (
    <span className="region-btn">
      <span>{info.flag}</span>
      <span className="region-gmt">{info.gmt}</span>
    </span>
  );
}

function WelcomePage() {
  const [scrolled, setScrolled] = useState(false);
  const [lang, setLang] = useState(() => {
    try { return localStorage.getItem("cepLang") || "es"; } catch (e) { return "es"; }
  });
  const s = STR[lang];

  useEffect(() => {
    try { localStorage.setItem("cepLang", lang); } catch (e) {}
    document.documentElement.lang = lang;
    document.title = s.docTitle;
  }, [lang]);

  useEffect(() => {
    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        setScrolled(window.scrollY > 90);
        ticking = false;
      });
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  return (
    <div className="page">
      <div className={"sticky-logo-bubble" + (scrolled ? " visible" : "")} aria-hidden={!scrolled}>
        <a href="/" aria-label={s.home}>
          <img src="/logo-navy.png" alt="The Corporate English Project" />
        </a>
      </div>

      <nav className="nav">
        <a className="nav-logo" href="/">
          <img src="/logo-navy.png" alt="The Corporate English Project" />
        </a>
        <div className="nav-right">
          <RegionBadge />
          <div className="region-divider" />
          <div className="lang-toggle" role="group" aria-label="Language">
            <span className="lang-toggle-icon"><GlobeIcon /></span>
            <button className={"seg" + (lang === "en" ? " active" : "")} onClick={() => setLang("en")}>EN</button>
            <button className={"seg" + (lang === "es" ? " active" : "")} onClick={() => setLang("es")}>ES</button>
          </div>
        </div>
      </nav>

      <main className="post-main">
        <h1 className="post-title">{s.heading}</h1>

        <div className="post-section">
          <h2 className="post-h2">{s.getInTouchTitle}</h2>
          <div className="post-body">
            <p>
              {s.getInTouchPre}{" "}
              <a className="post-link" href={WHATSAPP_LINK} target="_blank" rel="noopener noreferrer">{s.whatsappLabel}</a>
              {" "}{s.getInTouchPost}
            </p>
          </div>
        </div>

        <div className="post-section">
          <h2 className="post-h2">{s.notesTitle}</h2>
          <div className="post-body">
            <p>
              {s.notesP1Pre}{" "}
              <a className="post-link" href={NOTES_ARTICLE_LINK} target="_blank" rel="noopener noreferrer">{s.notesLinkLabel}</a>
              {s.notesP1Post}
            </p>
            <p>{s.notesQuestion}</p>
          </div>
          <ul className="post-list">
            {s.bullets.map((b, i) => <li key={i}>{b}</li>)}
          </ul>
          <div className="post-body">
            <p>{s.notesP2}</p>
          </div>
        </div>

        <div className="post-section">
          <h2 className="post-h2">{s.toolsTitle}</h2>
          <div className="post-body">
            <p>{s.toolsP1}</p>
            <p>{s.toolsP2}</p>
            <p>{s.toolsP3}</p>
            <p>{s.toolsP4}</p>
          </div>
        </div>

        <a className="post-back" href="/">← {s.home}</a>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<WelcomePage />);
</script>
</body>
</html>
