<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>¿Cuál clase es para ti? | The Corporate English Project</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Hanken+Grotesk:wght@400;500;600;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#20395c;
    --navy-deep:#152840;
    --navy-soft:#54688a;
    --sage:#5d7c69;
    --sage-deep:#465c4f;
    --sage-tint:#dce7dd;
    --bg:#f1f3ef;
    --surface:#ffffff;
    --line:#e0e4dd;
    --line-strong:#cdd4c9;
    --ink:#1e2a3a;
    --muted:#6c7787;
    --serif:"Playfair Display", Georgia, serif;
    --sans:"Hanken Grotesk", system-ui, sans-serif;
    --shadow-sm:0 1px 2px rgba(21,40,64,.05), 0 1px 3px rgba(21,40,64,.06);
    --shadow-md:0 6px 16px rgba(21,40,64,.08), 0 2px 6px rgba(21,40,64,.05);
    /* Cursos palette */
    --cur-navy:#1c3557;
    --cur-green:#4f7359;
    --cur-muted:#5b7288;
    --cur-muted2:#7d8b93;
    --cur-bg:#eef1ec;
    --cur-sans:'Lato', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh;}
  ::selection{background:var(--sage-tint);color:var(--navy-deep);}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;}

  .page{min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;}

  /* Nav */
  .nav{display:flex;align-items:center;justify-content:space-between;
    padding:0 40px 11px;max-width:1320px;margin:0 auto;width:100%;}
  .nav-logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--navy);}
  .nav-logo img{height:150px;width:auto;display:block;}

  /* Quiz page */
  .quiz-main{flex:1;background:var(--cur-bg);font-family:var(--cur-sans);padding:24px 0 80px;}
  .quiz-container{max-width:740px;margin:0 auto;padding:0 24px;}
  .quiz-breadcrumb{font-size:13px;color:var(--cur-muted2);margin:0 0 20px;}
  .quiz-breadcrumb a{text-decoration:none;color:var(--cur-muted2);}
  .quiz-breadcrumb a:hover{color:var(--cur-navy);}
  .quiz-title{font-family:var(--serif);font-weight:600;color:var(--cur-navy);
    font-size:clamp(28px,4.5vw,40px);line-height:1.15;margin:0 0 10px;letter-spacing:-.01em;}
  .quiz-instruction{font-size:16px;line-height:1.6;color:var(--cur-muted);margin:0 0 28px;max-width:56ch;}

  .quiz-list{list-style:none;margin:0 0 28px;padding:0;display:flex;flex-direction:column;gap:10px;}
  .quiz-item{display:flex;align-items:flex-start;gap:14px;background:#fff;
    border:1.5px solid rgba(79,115,89,.3);border-radius:12px;padding:16px 18px;
    cursor:pointer;transition:border-color .15s,background .15s;}
  .quiz-item:hover{border-color:var(--cur-green);}
  .quiz-item.checked{border-color:var(--cur-green);background:#f3f8f4;}
  .quiz-item input{appearance:none;-webkit-appearance:none;flex-shrink:0;width:24px;height:24px;
    margin:0;border-radius:6px;border:2px solid var(--line-strong);background:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;top:1px;}
  .quiz-item input:checked{background:var(--cur-green);border-color:var(--cur-green);}
  .quiz-item input:checked::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
  .quiz-item span{font-size:16px;line-height:1.5;color:var(--ink);}
  .quiz-item.locked{opacity:.4;pointer-events:none;cursor:default;}

  .quiz-submit{display:block;width:100%;background:var(--cur-navy);color:#fff;border:none;
    border-radius:12px;padding:17px 24px;font-size:16.5px;font-weight:700;
    transition:background .18s;}
  .quiz-submit:hover{background:var(--cur-green);}
  .quiz-submit:disabled{background:var(--cur-muted2);cursor:default;}

  .quiz-results{display:none;margin-top:48px;}
  .quiz-results.visible{display:block;}
  .quiz-result-kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--cur-muted2);font-weight:700;margin:0 0 8px;}
  .quiz-result-level{font-family:var(--serif);font-weight:600;color:var(--cur-navy);
    font-size:clamp(26px,4vw,36px);margin:0 0 14px;}
  .quiz-result-desc{font-size:17px;line-height:1.6;color:var(--cur-muted);margin:0 0 8px;max-width:58ch;}

  .quiz-whatsapp-wrap{margin-top:26px;}
  .quiz-whatsapp-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;
    background:var(--cur-navy);color:#fff;border-radius:12px;padding:16px 26px;
    font-size:16px;font-weight:700;text-decoration:none;transition:background .18s;}
  .quiz-whatsapp-btn:hover{background:var(--cur-green);}

  .quiz-retake{display:inline-block;margin-top:32px;font-size:14px;font-weight:700;
    color:var(--cur-navy);text-decoration:underline;text-decoration-color:rgba(28,53,87,.35);
    text-underline-offset:3px;background:none;border:none;padding:0;}
  .quiz-retake:hover{color:var(--cur-green);}

  /* Course cards — same design as the homepage Cursos section */
  .cursos-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;align-items:stretch;margin-top:8px;}
  .cursos-card{background:#fff;border:1px solid rgba(79,115,89,.45);border-radius:18px;
    padding:28px 24px 24px;box-shadow:0 2px 10px rgba(28,53,87,.05);
    display:flex;flex-direction:column;text-align:center;
    transition:box-shadow .2s,transform .18s;}
  .cursos-card:hover{box-shadow:0 12px 28px rgba(28,53,87,.11);transform:translateY(-2px);}
  .cursos-card-eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--cur-muted);font-weight:700;margin-bottom:10px;}
  .cursos-card-title{font-family:var(--serif);font-weight:600;font-size:28px;
    color:var(--cur-navy);margin:0 0 14px;line-height:1.15;}
  .cursos-card-meta{font-size:15px;line-height:1.45;color:var(--cur-muted);margin:0 0 4px;}
  .cursos-card-hr{width:46px;height:1px;background:rgba(79,115,89,.45);margin:18px auto;}
  .cursos-card-price{font-family:var(--serif);font-size:25px;color:var(--cur-navy);margin:0;}
  .cursos-card-pay{font-size:14px;color:var(--cur-muted2);margin:2px 0 20px;}
  .cursos-card-btn{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;
    gap:8px;background:var(--cur-navy);color:#fff;border-radius:10px;padding:13px 24px;
    font-size:15px;font-weight:700;text-decoration:none;transition:background .18s;}
  .cursos-card-btn:hover{background:var(--cur-green);}

  @media(max-width:640px){
    .nav{padding:0 20px 11px;}
    .quiz-container{padding:0 20px;}
    .cursos-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="page">
  <nav class="nav">
    <a class="nav-logo" href="/">
      <img src="/logo-navy.png" alt="The Corporate English Project" />
    </a>
  </nav>

  <main class="quiz-main">
    <div class="quiz-container">
      <div class="quiz-breadcrumb">
        <a href="/">Inicio</a> / <span>¿Cuál clase es para ti?</span>
      </div>

      <form id="quiz-form">
        <h1 class="quiz-title">¿Cuál clase es para ti?</h1>
        <p class="quiz-instruction">Marca todo lo que puedes hacer hoy en inglés.</p>

        <div class="quiz-list" id="quiz-list">
          <label class="quiz-item"><input type="checkbox" value="1" /><span>Todavía no hablo nada de inglés.</span></label>
          <label class="quiz-item"><input type="checkbox" value="2" /><span>Sé algunas palabras y frases básicas (hola, gracias, números, colores).</span></label>
          <label class="quiz-item"><input type="checkbox" value="3" /><span>Puedo presentarme y entender preguntas simples si me hablan despacio.</span></label>
          <label class="quiz-item"><input type="checkbox" value="4" /><span>Puedo hablar de mi rutina diaria con frases cortas.</span></label>

      <div class="quiz-results" id="quiz-results">

        <p class="quiz-result-desc" id="result-desc"></p>

        <div class="cursos-grid" id="result-cards"></div>

        <div class="quiz-whatsapp-wrap" id="result-whatsapp" style="display:none;">
          <a class="quiz-whatsapp-btn" id="whatsapp-link" target="_blank" rel="noopener noreferrer">Escríbeme por WhatsApp →</a>
        </div>

        <button type="button" class="quiz-retake" id="retake-btn">← Volver a intentar</button>
      </div>
    </div>
  </main>
</div>

<script>
(function(){
  function _cepCur(cc){return cc==='MX'?'MXN':cc==='CR'?'CRC':'USD';}
  function _cepFromTz(tz){
    if(!tz) return {countryCode:'US',currency:'USD'};
    var mxTz=/^America\/(Mexico_City|Monterrey|Merida|Mazatlan|Hermosillo|Chihuahua|Ojinaga|Bahia_Banderas|Cancun|Ensenada|Santa_Isabel|Tijuana)$/;
    if(mxTz.test(tz)) return {countryCode:'MX',currency:'MXN'};
    if(tz==='America/Costa_Rica') return {countryCode:'CR',currency:'CRC'};
    return {countryCode:'US',currency:'USD'};
  }
  var tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
  var tzGuess=_cepFromTz(tz);
  var stored=null;try{stored=JSON.parse(localStorage.getItem('cepRegionV2'));}catch(e){}
  if(stored&&stored.tz&&stored.currency){
    window._cepRegionPromise=Promise.resolve(stored);
  }else{
    var tzResult={countryCode:tzGuess.countryCode,currency:tzGuess.currency,tz:tz||'America/Mexico_City'};
    window._cepRegionPromise=fetch('https://ipapi.co/json/')
      .then(function(r){return r.json();})
      .then(function(d){
        var cc=d.country_code||tzGuess.countryCode;
        var apiTz=d.timezone||tz||'America/Mexico_City';
        var result={countryCode:cc,currency:_cepCur(cc),tz:apiTz};
        try{localStorage.setItem('cepRegionV2',JSON.stringify(result));}catch(e){}
        return result;
      })
      .catch(function(){
        try{localStorage.setItem('cepRegionV2',JSON.stringify(tzResult));}catch(e){}
        return tzResult;
      });
  }
})();
</script>
<script>
  // Same course data/logic as the course pages and homepage Cursos section,
  // so times, dates, caps, and prices always match. No data is saved
  // anywhere — this quiz runs entirely in the browser.
  var COURSES = {
    beginnerMonWed: { title:"Lunes y Miércoles", level:"Principiante",
      meta2:"6 semanas · inicia 2 de nov", meta3:"Cupo de 12 estudiantes",
      sessions:12, days:[1,3], hour:15, page:"/courses/beginner-mon-wed.html" },
    beginnerFriday: { title:"Viernes", level:"Principiante",
      meta2:"6 semanas · inicia 6 de nov", meta3:"Cupo de 15 estudiantes",
      sessions:6, days:[5], hour:15, page:"/courses/beginner-friday.html" },
    monwed: { title:"Lunes y Miércoles", level:"Intermedio",
      meta2:"6 semanas · inicia 2 de nov", meta3:"Cupo de 12 estudiantes",
      sessions:12, days:[1,3], hour:20, page:"/courses/mon-wed.html" },
    friday: { title:"Viernes", level:"Intermedio",
      meta2:"6 semanas · inicia 6 de nov", meta3:"Cupo de 15 estudiantes",
      sessions:6, days:[5], hour:20, page:"/courses/friday.html" },
  };
  var LEARN_MORE = "Conoce más";
  var PAY_ONCE = "pago único al inscribirte";
  var LANG = "es";

  function convertClassOccurrence(dayIdx, hour, srcTz, targetTz, lng) {
    var now = new Date();
    var DM = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
    var srcDow = DM[new Intl.DateTimeFormat('en-US',{timeZone:srcTz,weekday:'short'}).format(now)];
    if (srcDow === undefined) srcDow = 1;
    var ahead = (dayIdx - srcDow + 7) % 7;
    if (ahead === 0) {
      var h = parseInt(new Intl.DateTimeFormat('en-US',{timeZone:srcTz,hour:'numeric',hour12:false}).format(now));
      if (h >= hour) ahead = 7;
    }
    var next = new Date(now.getTime() + ahead * 86400000);
    var dp = new Intl.DateTimeFormat('en-US',{timeZone:srcTz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(next);
    var yr = parseInt(dp.find(function(p){return p.type==='year';}).value);
    var mo = parseInt(dp.find(function(p){return p.type==='month';}).value);
    var dy = parseInt(dp.find(function(p){return p.type==='day';}).value);
    var naive = new Date(Date.UTC(yr, mo-1, dy, hour, 0, 0));
    var tzPart = new Intl.DateTimeFormat('en',{timeZone:srcTz,timeZoneName:'shortOffset'})
      .formatToParts(naive).find(function(p){return p.type==='timeZoneName';});
    var tzStr = tzPart ? tzPart.value : 'GMT-6';
    var mtz = tzStr.match(/GMT([+-])(\d+)(?::(\d+))?/);
    var offH = mtz ? (mtz[1]==='+'?1:-1)*(parseInt(mtz[2])+(parseInt(mtz[3]||'0')/60)) : -6;
    var classUtc = new Date(naive.getTime() - offH * 3600000);
    var loc = lng === 'es' ? 'es-MX' : 'en-US';
    var wd = new Intl.DateTimeFormat(loc,{timeZone:targetTz,weekday:'long'}).format(classUtc);
    var t1 = new Intl.DateTimeFormat(loc,{timeZone:targetTz,hour:'numeric',minute:'2-digit',hour12:true}).format(classUtc);
    var t2 = new Intl.DateTimeFormat(loc,{timeZone:targetTz,hour:'numeric',minute:'2-digit',hour12:true}).format(new Date(classUtc.getTime()+3600000));
    return { weekday: wd.charAt(0).toUpperCase()+wd.slice(1), t1: t1, t2: t2 };
  }

  function courseSchedule(dayIdxs, tz, lng, hour) {
    try {
      var results = dayIdxs.map(function(d){ return convertClassOccurrence(d, hour || 20, "America/Chicago", tz, lng); });
      var sameTime = results.every(function(r){ return r.t1 === results[0].t1 && r.t2 === results[0].t2; });
      if (sameTime) {
        var days = results.map(function(r){ return r.weekday; }).join(lng === 'es' ? ' y ' : ' & ');
        return days + ' · ' + results[0].t1 + '–' + results[0].t2;
      }
      return results.map(function(r){ return r.weekday + ' ' + r.t1 + '–' + r.t2; }).join(', ');
    } catch(e) {
      return lng === 'es' ? 'Horario por confirmar' : 'Schedule TBD';
    }
  }

  // Strips the leading weekday off the schedule string — the card title
  // already names the day(s), so this avoids repeating it.
  function scheduleTimeOnly(schedule) {
    var idx = schedule.indexOf(' · ');
    return idx >= 0 ? schedule.slice(idx + 3) : schedule;
  }

  function classRate(cur) {
    return cur === 'MXN' ? 50 : cur === 'CRC' ? 1350 : 3;
  }
  function formatCoursePrice(cur, sessions) {
    var total = classRate(cur) * sessions;
    var formatted = total.toLocaleString('en-US');
    return cur === 'MXN' ? ('$' + formatted + ' MXN') : cur === 'CRC' ? (formatted + ' CRC') : ('$' + formatted + ' USD');
  }

  function renderCourseCard(course) {
    var el = document.createElement('div');
    el.className = 'cursos-card';
    var schedEl = document.createElement('div');
    schedEl.className = 'cursos-card-meta';
    schedEl.textContent = '…';
    var priceEl = document.createElement('div');
    priceEl.className = 'cursos-card-price';
    priceEl.textContent = '…';
    el.innerHTML =
      '<div class="cursos-card-eyebrow">' + course.level + '</div>' +
      '<div class="cursos-card-title">' + course.title + '</div>';
    el.appendChild(schedEl);
    var meta2 = document.createElement('div');
    meta2.className = 'cursos-card-meta';
    meta2.textContent = course.meta2;
    el.appendChild(meta2);
    var meta3 = document.createElement('div');
    meta3.className = 'cursos-card-meta';
    meta3.textContent = course.meta3;
    el.appendChild(meta3);
    var hr = document.createElement('div');
    hr.className = 'cursos-card-hr';
    el.appendChild(hr);
    el.appendChild(priceEl);
    var pay = document.createElement('div');
    pay.className = 'cursos-card-pay';
    pay.textContent = PAY_ONCE;
    el.appendChild(pay);
    var btn = document.createElement('a');
    btn.className = 'cursos-card-btn';
    btn.href = course.page + '?lang=' + LANG;
    btn.textContent = LEARN_MORE + ' →';
    el.appendChild(btn);

    window._cepRegionPromise.then(function(region){
      var tz = region.tz || "America/Mexico_City";
      schedEl.textContent = scheduleTimeOnly(courseSchedule(course.days, tz, LANG, course.hour));
      priceEl.textContent = formatCoursePrice(region.currency, course.sessions);
    });

    return el;
  }

  var RESULTS = {
    beginner: {
      level: "Principiante",
      desc: "Sabes algunas cosas, pero todavía no puedes tener una conversación. ¡Perfecto, aquí empiezas!",
      courseKeys: ["beginnerMonWed", "beginnerFriday"]
    },
    intermediate: {
      level: "Intermedio",
      desc: "Te comunicas, pero a veces te faltan las palabras para expresar tus ideas.",
      courseKeys: ["monwed", "friday"]
    },
    advanced: {
      level: "Avanzado",
      desc: "¡Tu nivel es avanzado! Escríbeme para más información sobre las clases avanzadas.",
      courseKeys: []
    }
  };

  // Result is based on the highest-numbered statement checked, not the count.
  function computeLevel(checked) {
    if (!checked.length) return 'beginner';
    var highest = Math.max.apply(null, checked);
    if (highest <= 5) return 'beginner';
    if (highest <= 8) return 'intermediate';
    return 'advanced';
  }

  var form = document.getElementById('quiz-form');
  var resultsEl = document.getElementById('quiz-results');
  var cardsEl = document.getElementById('result-cards');
  var whatsappWrap = document.getElementById('result-whatsapp');
  var whatsappLink = document.getElementById('whatsapp-link');
  var submitBtn = form.querySelector('.quiz-submit');
  var quizList = document.getElementById('quiz-list');
  var allCheckboxes = Array.from(quizList.querySelectorAll('input[type="checkbox"]'));
  var item1 = allCheckboxes[0];
  var otherCheckboxes = allCheckboxes.slice(1);

  function renderResults(levelKey) {
    var result = RESULTS[levelKey];
    document.getElementById('result-level').textContent = result.level;
    document.getElementById('result-desc').textContent = result.desc;

    cardsEl.innerHTML = '';
    if (result.courseKeys.length) {
      cardsEl.style.display = '';
      result.courseKeys.forEach(function(key){
        cardsEl.appendChild(renderCourseCard(COURSES[key]));
      });
    } else {
      cardsEl.style.display = 'none';
    }

    if (levelKey === 'advanced') {
      whatsappWrap.style.display = '';
      whatsappLink.href = "https://wa.me/525572132329?text=" + encodeURIComponent(
        "Hola, mi nivel de inglés salió avanzado en el cuestionario de CEP. Me gustaría más información sobre las clases avanzadas."
      );
    } else {
      whatsappWrap.style.display = 'none';
    }
  }

  // Toggle visual "checked" state on a row, and handle statement #1's special
  // lock behavior: checking it means "todavía no hablo nada de inglés", so the
  // other statements stop applying — they're cleared and grayed out, and the
  // Beginner result shows immediately. Unchecking #1 turns them back on.
  quizList.addEventListener('change', function(e){
    var cb = e.target;
    var item = cb.closest('.quiz-item');
    if (cb === item1) {
      if (cb.checked) {
        otherCheckboxes.forEach(function(ocb){
          ocb.checked = false;
          ocb.disabled = true;
          ocb.closest('.quiz-item').classList.remove('checked');
          ocb.closest('.quiz-item').classList.add('locked');
        });
        if (item) item.classList.add('checked');
        submitBtn.disabled = true;
        renderResults('beginner');
        resultsEl.classList.add('visible');
      } else {
        otherCheckboxes.forEach(function(ocb){
          ocb.disabled = false;
          ocb.closest('.quiz-item').classList.remove('locked');
        });
        if (item) item.classList.remove('checked');
        submitBtn.disabled = false;
        resultsEl.classList.remove('visible');
      }
      return;
    }
    if (item) item.classList.toggle('checked', cb.checked);
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var checked = Array.from(form.querySelectorAll('input[type="checkbox"]:checked'))
      .map(function(el){ return parseInt(el.value, 10); });
    var levelKey = computeLevel(checked);
    renderResults(levelKey);

    form.style.display = 'none';
    resultsEl.classList.add('visible');
    resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  document.getElementById('retake-btn').addEventListener('click', function(){
    form.reset();
    form.querySelectorAll('.quiz-item.checked').forEach(function(el){ el.classList.remove('checked'); });
    otherCheckboxes.forEach(function(ocb){
      ocb.disabled = false;
      ocb.closest('.quiz-item').classList.remove('locked');
    });
    submitBtn.disabled = false;
    resultsEl.classList.remove('visible');
    form.style.display = '';
    form.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
</script>
</body>
